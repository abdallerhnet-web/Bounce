<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a2e">
<title>BOUNCE: A Coin Journey to Solana</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0b0618;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
  #game{width:100%;height:100%;image-rendering:pixelated;display:block}
  .hidden{display:none!important}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,20,.55);z-index:20;padding:10px;overflow:auto}
  .card{width:min(440px,100%);max-height:100%;overflow:auto;background:rgba(18,10,46,.94);border:2px solid #ffd54a;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;text-align:center}
  h1{margin:0;font-size:42px;letter-spacing:4px;color:#ffd54a;text-shadow:3px 3px 0 #7a3cff}
  h2{margin:0;color:#ffd54a}
  .sub{margin:-4px 0 4px;color:#cbb8ff}
  #menucoin{align-self:center;width:120px;height:120px}
  button{font:inherit;font-weight:700;font-size:16px;padding:12px;border-radius:10px;border:2px solid #8a5a00;background:linear-gradient(#ffd54a,#ffb300);color:#3a2400;cursor:pointer}
  button:active{transform:translateY(2px)}
  button.ghost{background:transparent;color:#ffd54a;border-color:#ffd54a}
  button.danger{background:#7a1f2b;color:#fff;border-color:#ff6b81}
  button:disabled{opacity:.5}
  .note{font-size:12px;color:#b9a8e8;margin:2px 0}
  .story{font-size:15px;line-height:1.5;margin:4px 0}
  .worlds{display:flex;flex-direction:column;gap:8px}
  .world{display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px;background:#2b1b66;color:#fff;border-color:#7a3cff}
  .world span{grid-column:1;font-weight:400;font-size:12px;color:#cbb8ff}
  .world em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;font-size:13px;color:#ffd54a}
  .world.locked{opacity:.45}
  label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
  label.chk{justify-content:flex-start}
  input[type=range]{width:55%}
  .terms{display:flex;flex-direction:column;gap:6px;text-align:left;max-height:55vh;overflow:auto}
  .term{background:#2b1b66;border-radius:8px;padding:8px}
  .term b{display:block;color:#ffd54a}
  .term span{font-size:13px;color:#e6dcff}
  .term.dim{opacity:.5}
  #toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);transition:transform .25s;z-index:15;width:min(460px,94vw);background:rgba(18,10,46,.95);border:2px solid #ffd54a;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;pointer-events:none}
  #toast.show{transform:translate(-50%,36px)}
  #toast b{display:block;color:#ffd54a;font-size:15px}
  #toast i{display:block;font-size:10px;color:#9a88d0;margin-top:3px}
  #pausebtn{position:fixed;top:8px;right:8px;z-index:12;width:48px;height:40px;padding:0;font-size:18px}
  #controls{position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:10;pointer-events:none}
  @media (orientation:landscape){#controls{height:auto;top:0}}
  #controls .pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:14px;pointer-events:none}
  #controls .l{left:16px}#controls .r{right:16px}
  #controls button{pointer-events:auto;width:78px;height:78px;border-radius:50%;font-size:26px;padding:0;opacity:.78;background:rgba(255,213,74,.88)}
  #controls button.big{width:96px;height:96px}
  #controls button.on{opacity:1;filter:brightness(1.3)}
  @media (hover:hover) and (pointer:fine){#controls{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="800" height="448"></canvas></div>
<div id="ui"></div>
<div id="toast"></div>
<button id="pausebtn" class="hidden" aria-label="Pause">II</button>
<div id="controls" class="hidden">
  <div class="pad l"><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div>
  <div class="pad r"><button data-k="attack" aria-label="Spin attack">✦</button><button class="big" data-k="jump" aria-label="Jump">▲</button></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
